name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      llm:
        description: "Also run the red-team suite against Claude (needs the ANTHROPIC_API_KEY repository secret)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Red-team suite (template mode)
        run: python -m redteam.run_injection_tests
      - name: Offline demo
        run: python -m kevlar.cli --out "$RUNNER_TEMP/kevlar-out"

  redteam-llm:
    # Manual only: Actions > CI > Run workflow > tick "llm". Costs a few cents.
    if: github.event_name == 'workflow_dispatch' && inputs.llm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Red-team suite (LLM mode)
        shell: bash  # explicit bash enables pipefail, so a failing suite still fails the job
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m redteam.run_injection_tests --llm --results-dir "$RUNNER_TEMP/redteam" \
            | tee "$RUNNER_TEMP/redteam-llm.txt"
      - name: Publish results to the run summary
        if: always()
        shell: bash
        run: |
          # The generated tables exist only if the suite ran to completion; fall
          # back to the console output so a crashed run still reports something.
          if ls "$RUNNER_TEMP"/redteam/llm-*.md >/dev/null 2>&1; then
            cat "$RUNNER_TEMP"/redteam/llm-*.md >> "$GITHUB_STEP_SUMMARY"
          else
            { echo '### Red-team suite (LLM mode)'; echo '```'; cat "$RUNNER_TEMP/redteam-llm.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
